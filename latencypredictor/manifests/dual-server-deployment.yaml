# Dual-server deployment for CKS cluster using HTTP for model sharing

# --- 1. ConfigMaps ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: latency-predictor-config
  namespace: llm-d-pd
data:
  LATENCY_RETRAINING_INTERVAL_SEC: "30"
  LATENCY_MIN_SAMPLES_FOR_RETRAIN: "100"
  LATENCY_TTFT_MODEL_PATH: "/models/ttft.joblib"
  LATENCY_TPOT_MODEL_PATH: "/models/tpot.joblib"
  LATENCY_TTFT_SCALER_PATH: "/models/ttft_scaler.joblib"
  LATENCY_TPOT_SCALER_PATH: "/models/tpot_scaler.joblib"
  LATENCY_MODEL_TYPE: "xgboost"
  LATENCY_MAX_TRAINING_DATA_SIZE_PER_BUCKET: "5000"
  LATENCY_QUANTILE_ALPHA: "0.9"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-server-config
  namespace: llm-d-pd
data:
  MODEL_SYNC_INTERVAL_SEC: "10"  # Download models every 10 seconds
  LATENCY_MODEL_TYPE: "xgboost"
  PREDICT_HOST: "0.0.0.0"
  PREDICT_PORT: "8001"
  TRAINING_SERVER_URL: "http://training-service:8000"
  LOCAL_TTFT_MODEL_PATH: "/local_models/ttft.joblib"
  LOCAL_TPOT_MODEL_PATH: "/local_models/tpot.joblib"
  LOCAL_TTFT_SCALER_PATH: "/local_models/ttft_scaler.joblib"
  LOCAL_TPOT_SCALER_PATH: "/local_models/tpot_scaler.joblib"
  HTTP_TIMEOUT: "30"

---
# --- 2. Persistent Volume Claim (PVC) ---
# Requests persistent storage for the models - uses default storage class
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-models-pvc
  namespace: llm-d-pd
spec:
  accessModes:
    - ReadWriteOnce # Sufficient since only the training pod writes to the volume
  resources:
    requests:
      storage: 10Gi
---
# --- 3. Training Server Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-server-deployment
  namespace: llm-d-pd
  labels:
    app: training-server
    component: training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-server
      component: training
  template:
    metadata:
      labels:
        app: training-server
        component: training
    spec:
      containers:
      - name: training-server
        image: quay.io/rh_ee_rsaini/latency-training:slo-experimental
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: training-port
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 10
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        envFrom:
        - configMapRef:
            name: latency-predictor-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVER_TYPE
          value: "training"
        volumeMounts:
        - name: model-storage
          mountPath: /models
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: training-models-pvc

---
# --- 4. Prediction Server Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-server-deployment
  namespace: llm-d-pd
  labels:
    app: prediction-server
    component: prediction
spec:
  replicas: 10
  selector:
    matchLabels:
      app: prediction-server
      component: prediction
  template:
    metadata:
      labels:
        app: prediction-server
        component: prediction
    spec:
      containers:
      - name: prediction-server
        image: quay.io/rh_ee_rsaini/latency-prediction:slo-experimental
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          name: predict-port
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 10  # Allow more failures while downloading models
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        envFrom:
        - configMapRef:
            name: prediction-server-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SERVER_TYPE
          value: "prediction"
        volumeMounts:
        # Only local storage needed - no shared volumes!
        - name: local-model-storage
          mountPath: /local_models
      volumes:
      - name: local-model-storage
        emptyDir: {}  # Each pod gets its own local storage

---
# --- 5. Services ---
apiVersion: v1
kind: Service
metadata:
  name: training-service
  namespace: llm-d-pd
  labels:
    component: training
spec:
  type: ClusterIP
  selector:
    app: training-server
    component: training
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    name: training

---
apiVersion: v1
kind: Service
metadata:
  name: prediction-service
  namespace: llm-d-pd
  labels:
    component: prediction
spec:
  type: LoadBalancer
  selector:
    app: prediction-server
    component: prediction
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8001
    name: prediction

---
# --- 6. Optional: External Training Service ---
apiVersion: v1
kind: Service
metadata:
  name: training-service-external
  namespace: llm-d-pd
spec:
  type: LoadBalancer
  selector:
    app: training-server
    component: training
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8000

