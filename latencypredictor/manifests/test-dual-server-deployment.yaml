# --- Test Job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: latency-predictor-test
  namespace: llm-d-pd
  labels:
    app: latency-predictor-test
    component: test
spec:
  template:
    metadata:
      labels:
        app: latency-predictor-test
        component: test
    spec:
      restartPolicy: Never
      containers:
      - name: test-runner
        # Use the test image with pytest installed
        image: quay.io/rh_ee_rsaini/latency-test:slo-experimental
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
        # Point to your internal services
        - name: TRAINING_SERVER_URL
          value: "http://training-service:8000"
        - name: PREDICTION_SERVER_URL
          value: "http://prediction-service:80"
        - name: TEST_TIMEOUT
          value: "300"  # 5 minutes
        - name: TARGET_QPS
          value: "50"  # Reduced from 1000 to avoid OOM (50 QPS × 100s = 5k tasks vs 100k)
        - name: TARGET_QPS_LARGE_BATCH
          value: "5"  # Reduced from 100 to avoid OOM with batch_size=1000
        envFrom:
        - configMapRef:
            name: prediction-server-config  # Reuse existing config if needed
        # Override the default command to run specific pytest
        command: ["pytest"]
        args: ["-v", "-s", "test_dual_server_client.py"]
        # If your tests need to store results or logs
        volumeMounts:
        - name: test-results
          mountPath: /test-results
      volumes:
      - name: test-results
        emptyDir: {}
  backoffLimit: 3  # Retry up to 3 times if test fails